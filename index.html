<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Page Deploy</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f6f7f9;
        --surface: #ffffff;
        --text: #1c1f24;
        --muted: #5c6470;
        --accent: #2f6fed;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #14161a;
          --surface: #1e2127;
          --text: #eceef1;
          --muted: #9aa3af;
          --accent: #7aa5ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        background: var(--background);
        color: var(--text);
      }

      main {
        width: 100%;
        max-width: 560px;
        padding: 40px 32px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 4px 24px rgb(0 0 0 / 8%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
        line-height: 1.2;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
      }

      .status {
        display: inline-block;
        margin: 0;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--accent);
        border: 1px solid currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Test Page Deploy</h1>
      <p>This is a simple sample page. If you can read this, the deployment works.</p>
      <p class="status">Deployed successfully</p>
    </main>
  </body>
</html>
